<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Syllabus Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#3b3f5c;--mute:#7e84a3;--line:rgba(130,140,200,.16);--bg1:#ffffff;--bg2:#f3f2fc;
--c1:rgba(255,255,255,.62);--c2:rgba(255,255,255,.28);--cb:rgba(255,255,255,.78);--cs:0 10px 30px rgba(110,120,190,.16);--hi:rgba(255,255,255,.95);--lo:rgba(140,150,215,.16);--sh:rgba(255,255,255,.6);--sh2:rgba(255,255,255,.18);
--top1:rgba(255,255,255,.7);--top2:rgba(255,255,255,.4);--bk1:rgba(255,255,255,.95);--bk2:rgba(220,226,248,.6);--bkc:#5b5f94;
--track:rgba(150,160,215,.2);--ring:#eef0f8;--chk1:rgba(255,255,255,.9);--chk2:rgba(205,212,240,.5);--chkb:rgba(255,255,255,.9);
--b1:rgba(150,176,232,.95);--b2:rgba(114,124,200,.95);--g1:rgba(255,255,255,.8);--g2:rgba(235,238,252,.5);--gc:#5b5f94;
--ta:rgba(255,255,255,.55);--tab:rgba(255,255,255,.8);--x:#a3a8c4;--rt:#f4f5fc;--shadow:rgba(122,127,196,.28);
--w1a:#9dbbea;--w1b:#bdc8f2;--w2a:#c8b8f0;--w2b:#aab6ef;--w3a:#a8b2e9;--w3b:#bcd2f1;--wo:.6}
:root[data-theme=dark]{color-scheme:dark;
--ink:#e8eaff;--mute:#a9afd0;--line:rgba(255,255,255,.09);--bg1:#0b0e1f;--bg2:#151836;
--c1:rgba(255,255,255,.11);--c2:rgba(255,255,255,.04);--cb:rgba(255,255,255,.16);--cs:0 10px 30px rgba(0,0,0,.4);--hi:rgba(255,255,255,.22);--lo:rgba(0,0,0,.3);--sh:rgba(255,255,255,.14);--sh2:rgba(255,255,255,.03);
--top1:rgba(255,255,255,.12);--top2:rgba(255,255,255,.05);--bk1:rgba(255,255,255,.2);--bk2:rgba(255,255,255,.06);--bkc:#cfd4ff;
--track:rgba(255,255,255,.12);--ring:rgba(255,255,255,.07);--chk1:rgba(255,255,255,.18);--chk2:rgba(255,255,255,.05);--chkb:rgba(255,255,255,.28);
--b1:#7a91dc;--b2:#5d62bb;--g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.05);--gc:#cfd4ff;
--ta:rgba(255,255,255,.07);--tab:rgba(255,255,255,.16);--x:#7f85a8;--rt:#1a1d3a;--shadow:rgba(0,0,0,.45);
--w1a:#3a4f8f;--w1b:#4a4d94;--w2a:#5a4590;--w2b:#404a92;--w3a:#343f7c;--w3b:#2f5486;--wo:.62}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg1);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.bg svg{position:absolute;left:-6%;top:-6%;width:112%;height:112%;filter:blur(20px);opacity:var(--wo)}
.bg path{animation:flow 20s ease-in-out infinite alternate;transform-box:fill-box}
.bg .w2{animation-duration:26s;animation-direction:alternate-reverse}
.bg .w3{animation-duration:23s}
@keyframes flow{from{transform:translate(-4%,-3%)}to{transform:translate(4%,3%)}}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:26px;margin:8px 0 4px;font-weight:700;letter-spacing:-.4px}
.hd{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.hd h1{margin:0}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 10px 6px 6px;margin:0 0 4px;border-radius:26px;
background:linear-gradient(135deg,var(--top1),var(--top2));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
border:1px solid var(--cb);box-shadow:var(--cs),inset 0 1px 0 var(--hi)}
.top h1{flex:1;margin:0;font-size:22px}
.back{display:grid;place-items:center;border:1px solid var(--cb);background:linear-gradient(160deg,var(--bk1),var(--bk2));color:var(--bkc);width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;box-shadow:0 3px 10px var(--shadow),inset 0 1px 0 var(--hi);transition:transform .15s;flex:none}
.back:active{transform:scale(.92)}
.card{position:relative;margin:14px 0;padding:16px;border-radius:26px;
background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
border:1px solid var(--cb);box-shadow:var(--cs),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(155deg,var(--sh) 0%,transparent 32%,transparent 70%,var(--sh2) 100%)}
.sc{display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.sc:active{transform:scale(.975)}
.sc>span{font-weight:700;color:var(--c,#7a7fc4)}
.sub{color:var(--mute);font-size:14px}
.bar{height:9px;border-radius:9px;background:var(--track);overflow:hidden;margin:8px 0 4px;box-shadow:inset 0 1px 3px rgba(100,110,180,.22)}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 8px rgba(130,140,210,.35)}
.leg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.leg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 4px rgba(100,110,180,.3)}
svg{filter:drop-shadow(0 6px 14px var(--shadow))}
svg.ic{filter:none}
.t1{fill:var(--ink)}.t2{fill:var(--mute)}
.topic{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:52px;cursor:pointer}
.topic:last-child{border-bottom:0}
.chk{width:28px;height:28px;border-radius:50%;border:1px solid var(--chkb);background:linear-gradient(160deg,var(--chk1),var(--chk2));flex:none;display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 2px 6px var(--shadow),inset 0 1px 0 var(--hi);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.topic:active .chk{transform:scale(.88)}
.topic.on .chk{background:linear-gradient(160deg,rgba(255,255,255,.55),var(--c) 55%);border-color:rgba(255,255,255,.7);box-shadow:0 3px 10px var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)}
.topic .nm{flex:1}
.topic.on .nm{color:var(--mute);text-decoration:line-through}
.x{border:0;background:none;color:var(--x);font:inherit;font-size:20px;min-width:44px;min-height:44px}
.btn{border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:12px 16px;background:linear-gradient(180deg,var(--b1),var(--b2));color:#fff;font:inherit;font-weight:600;min-height:48px;width:100%;box-shadow:0 8px 20px var(--shadow),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(70,80,150,.18);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--gc);border-color:var(--cb);box-shadow:0 6px 18px var(--shadow),inset 0 1px 0 var(--hi)}
.btn+.btn{margin-top:8px}
textarea{width:100%;min-height:110px;border:1px solid var(--tab);border-radius:18px;padding:12px;font:inherit;font-size:15px;color:var(--ink);background:var(--ta);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 2px 6px rgba(100,110,180,.14);margin-bottom:10px;resize:vertical;outline:none}
textarea::placeholder{color:var(--mute)}
textarea:focus{border-color:rgba(122,127,196,.7);box-shadow:0 0 0 3px rgba(150,160,225,.28)}
.cd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;margin:10px 0}
.cd-l{min-width:0}
.cd-t{font-size:11px;color:var(--mute);letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.cd-v{display:flex;align-items:baseline;gap:10px;margin:2px 0 0;min-height:30px;font-variant-numeric:tabular-nums}
.cd-v div{display:flex;align-items:baseline;gap:4px}
.cd-v b{font-size:24px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.cd-v small{font-size:11px;color:var(--mute)}
.pill{flex:none;border:1px solid var(--cb);border-radius:999px;padding:7px 12px;min-height:34px;font:inherit;font-size:12px;font-weight:600;color:var(--gc);background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 14px var(--shadow),inset 0 1px 0 var(--hi);transition:transform .15s;white-space:nowrap}
.pill:active{transform:scale(.95)}
.hint{font-size:13px;color:var(--mute);margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.bg path{animation:none}*{transition:none!important}}
@media (prefers-reduced-transparency:reduce){.card,.top,.btn.g,textarea{background:var(--rt);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style></head>
<body><div class="bg" aria-hidden="true"><svg viewBox="0 0 400 800" preserveAspectRatio="none"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--w1a)"/><stop offset="1" style="stop-color:var(--w1b)"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--w2a)"/><stop offset="1" style="stop-color:var(--w2b)"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--w3a)"/><stop offset="1" style="stop-color:var(--w3b)"/></linearGradient></defs>
<path class="w1" fill="url(#g1)" d="M-60 110C70 20 190 210 460 80L460 320C230 430 110 250-60 360Z"/>
<path class="w2" fill="url(#g2)" d="M-60 430C90 330 230 540 460 410L460 650C270 730 130 560-60 660Z"/>
<path class="w3" fill="url(#g3)" d="M-60 710C110 620 270 790 460 700L460 900L-60 900Z"/></svg></div><div class="wrap" id="app"></div>
<script>
const COL={a:['#7fa3d9','#e3ebf7'],p:['#a58fd6','#ece6f7'],b:['#7a7fc4','#e4e5f4']};
const COLD={a:'#2a3558',p:'#382f58',b:'#2d3057'};
let theme='auto';try{theme=localStorage.getItem('syl-theme')||'auto'}catch(e){}
const mq=window.matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>theme==='dark'||(theme==='auto'&&mq.matches);
const T=id=>isDark()?COLD[id]:COL[id][1];
function applyTheme(){const d=isDark();document.documentElement.dataset.theme=d?'dark':'light';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#0b0e1f':'#ffffff'}
function setTheme(v){theme=v;try{localStorage.setItem('syl-theme',v)}catch(e){}applyTheme();render(true)}
if(mq.addEventListener)mq.addEventListener('change',()=>{if(theme==='auto'){applyTheme();render(true)}});
const SEED={
a:[[['Histology','Structure of cell|Cell division|Epithelial tissue|Gland|Connective tissue|Bones|Ossification|Cartilage|Joints|Muscular tissue|Nervous tissue|Nervous system and receptors|Skin|Vascular system|Lymphoid tissue'],
['Embryology','Gametogenesis and oogenesis|Fertilization and implantation|Placenta and fetal membrane|First week of development|Second week of development|Pharyngeal cleft, arch and pouch|Third week of development|Germ layers|Notochord|Neural tube|Explain anatomically, developmentally, histologically (why questions)'],
['Head and Neck','Scalp|Face|Neck|Muscles|Tongue|Pharynx|Larynx|Parotid gland|Thyroid and parathyroid gland|Pituitary gland|Meninges|Nasal cavity and paranasal sinus|Ear|Explain developmentally, anatomically, histologically'],
['Brain and Eyeball','Cranial nerves|Forebrain (cerebrum)|Midbrain|Pons|Tracts|Limbic system|Cerebellum|Internal capsule|Subarachnoid space and CSF|Spinal cord|Motor neuron lesion|Eyeball']],
[['Thorax','Thoracic wall|Pericardium|Heart|Trachea|Bronchial tree|Lungs|Mediastinum|Thoracic cage|Azygos vein|Long thoracic nerve|Thoracic duct'],
['Abdomen','Anterior abdominal wall|Rectus sheath|Inguinal canal|Gastrointestinal tract|Oesophagus|Stomach|Small and large intestine|Anal canal|Celiac trunk|Peritoneum|Mesentery|Vermiform appendix|Hepatobiliary system|Pancreas|Spleen|Renal system|Ureter|Adrenal gland|Urinary bladder|Prostate|Scrotum and testis|Female genital|Uterus|Fallopian tube|Ovary|Bony pelvis|Diaphragm|Portal system'],
['Superior Extremity','Breast|Axilla|Arm, forearm and hand|Shoulder joint'],
['Inferior Extremity','']]],
p:[[['General Physiology','Introduction to general physiology|Cell and its organelles|Membrane transport process|Membrane potential and action potential|Muscle contraction'],
['Blood','Composition|Erythropoiesis|RBC and haemoglobin|Anaemia and jaundice|WBC|Platelet and blood coagulation|Blood grouping and blood transfusion|Immunity'],
['Cardiovascular System','Conducting system|Cardiac volumes|Cardiac cycle|Heart sounds|Blood pressure|Hypertension|ECG|Heart block|Shock|Circulation|Exercise'],
['Respiratory System','Mechanism of respiration|Regulation of respiration|Lung volume and capacity|Transport of gases|Asphyxia and hypoxia'],
['GIT Elementary System','Hormones of GIT|Digestive juices|Digestion and absorption of carbohydrate|Digestion and absorption of protein|Digestion and absorption of fat|Functions and movements of GIT']],
[['Renal Physiology and Body Fluid','Nephron and GFR|Renal circulation|Reabsorption, secretion and excretion|Urine formation|Acid-base balance|Clearance test|Counter current mechanism|Body fluids'],
['Endocrinology','Hormones and mechanism of action|Pituitary hormone|Growth hormone|Thyroid hormone|Parathyroid hormone|Adrenal hormones|Pancreatic hormones (insulin and glucagon)'],
['Reproductive System','Male reproduction|Female reproduction'],
['Nervous System','Nerve fibre|Neurotransmitter|Synapse|Receptor|Receptor potential|Reflex|Tracts|Motor function and muscle tone|UMN and LMN lesions|Cerebellum and its lesions|Hypothalamus, sleep, amnesia'],
['Special Sense','Vision|Refractive error|Pain and touch|Taste|Hearing|Temperature regulation']]],
b:[[['Biophysics','pH and buffer|Different laws|Isotopes|Solutions|Colloids and crystalloids|Transport processes'],
['Biomolecules','Carbohydrate|Protein|Lipid|Lipoprotein'],
['Enzymes','Enzyme'],
['Digestive Systems','Digestive juices|Digestion and absorption of carbohydrate|Digestion and absorption of protein|Digestion and absorption of fat'],
['Metabolism','Introduction|Carbohydrate metabolism|Protein metabolism|Fat metabolism'],
['Clinical Endocrinology','Cellular communications|Thyroid|Diabetes|Calcium homeostasis'],
['Clinical Biochemistry','Clinical biochemistry|Function tests']],
[['Food and Nutrition','Food|Balanced diet|Nutrient|Dietary fibre|BMR|SDA and RQ|Malnutrition|PEM|Obesity and BMI'],
['Vitamins','Introduction|Vitamin A|Vitamin D|Vitamin K|Vitamin B complex|Vitamin C'],
['Renal System','Renal system'],
['Body Fluid, Electrolyte and Acid-Base Balance','Body fluid|Electrolytes|Acid-base balance'],
['Genetics and Molecular Biology','Introduction|Gene, genome, genetic code|Replication|Transcription|Translation|Recombinant DNA technology|Polymerase chain reaction (PCR)|DNA|RNA|Mutation|Genetic disorders']]]};
function buildSeed(){const nm={a:'Anatomy',p:'Physiology',b:'Biochemistry'};return ['a','p','b'].map(id=>({id,name:nm[id],p:SEED[id].map((chs,pi)=>({id:id+(pi+1),name:'Paper '+(pi+1),ch:chs.map((c,ci)=>({id:`${id}${pi+1}c${ci}`,name:c[0],t:(c[1]?c[1].split('|'):[]).map((n,ti)=>({id:`${id}${pi+1}c${ci}t${ti}`,name:n,d:0}))}))}))}))}
let S=null;
try{S=JSON.parse(localStorage.getItem('syl2'))}catch(e){}
if(!Array.isArray(S)||!S.length||!S.every(s=>s&&Array.isArray(s.p))){
  S=buildSeed();
  try{const o=JSON.parse(localStorage.getItem('syl1'));if(Array.isArray(o))o.forEach(os=>{const dn=new Set();(os.ch||[]).forEach(c=>(c.t||[]).forEach(t=>{if(t.d)dn.add(t.name.trim().toLowerCase())}));const ns=S.find(x=>x.id===os.id);if(ns)ns.p.forEach(p=>p.ch.forEach(c=>c.t.forEach(t=>{if(dn.has(t.name.toLowerCase()))t.d=1})))})}catch(e){}
  try{localStorage.setItem('syl2',JSON.stringify(S))}catch(e){}
}
const save=()=>{try{localStorage.setItem('syl2',JSON.stringify(S))}catch(e){}};
let V={s:null,p:null,c:null},pend=null,sheet=false,bk=null,bkMsg='';
const app=document.getElementById('app');
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pcnt=P=>{let n=0,d=0;P.ch.forEach(c=>c.t.forEach(t=>{n++;if(t.d)d++}));return[n,d]};
const cnt=s=>s.p.reduce((a,P)=>{const[n,d]=pcnt(P);return[a[0]+n,a[1]+d]},[0,0]);
const pct=(d,n)=>n?Math.round(d/n*100):0;
const cur=()=>S.find(x=>x.id===V.s);
const PP=()=>cur().p.find(x=>x.id===V.p);
const CH=()=>PP().ch.find(c=>c.id===V.c);

const TARGET=new Date(2026,10,1,0,0,0).getTime();
let cdMode=0;try{cdMode=+localStorage.getItem('syl-cd')||0}catch(e){}
const CDL=['Days & hours','Hours','Seconds'];
const nf=n=>n.toLocaleString('en-US');
function cdInner(){
  const ms=Math.max(0,TARGET-Date.now());
  if(!ms)return '<div><b>0</b><small>Nov 1 has arrived</small></div>';
  if(cdMode===1)return `<div><b>${nf(Math.floor(ms/3600000))}</b><small>hours</small></div>`;
  if(cdMode===2)return `<div><b>${nf(Math.floor(ms/1000))}</b><small>seconds</small></div>`;
  const d=Math.floor(ms/86400000),hr=Math.floor(ms%86400000/3600000);
  return `<div><b>${d}</b><small>${d===1?'day':'days'}</small></div><div><b>${hr}</b><small>${hr===1?'hour':'hours'}</small></div>`;
}
function cdCard(){return `<div class="card cd"><div class="cd-l"><div class="cd-t">Until 1 Nov 2026</div><div class="cd-v" id="cdv">${cdInner()}</div></div><button class="pill" id="cdm" data-a="cd">${CDL[cdMode]} ⇄</button></div>`}
function updateCd(){const v=document.getElementById('cdv');if(v)v.innerHTML=cdInner();const m=document.getElementById('cdm');if(m)m.textContent=CDL[cdMode]+' ⇄'}
setInterval(updateCd,1000);
document.addEventListener('visibilitychange',updateCd);
function donut(segs,size,sw,big,small){
  const r=(size-sw)/2,m=size/2,C=2*Math.PI*r,T=segs.reduce((a,s)=>a+s.n,0);
  const arc=(o,len,col)=>`<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${Math.max(len,0.01)} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 ${m} ${m})"/>`;
  let out=`<circle cx="${m}" cy="${m}" r="${r}" fill="none" style="stroke:var(--ring)" stroke-width="${sw}"/>`,o=0;
  if(T){
    const gap=segs.filter(s=>s.n).length>1?3:0;
    segs.forEach(s=>{
      if(!s.n)return;
      const L=s.n/T*C;
      out+=arc(o,L-gap,s.t);
      if(s.d)out+=arc(o,s.d===s.n?L-gap:s.d/T*C,s.c);
      o+=L;
    });
  }
  if(big!==undefined){
    const f=size*0.19;
    out+=`<text x="${m}" y="${small?m+f*0.3:m+f*0.35}" text-anchor="middle" font-size="${f}" font-weight="700" class="t1">${big}</text>`;
    if(small)out+=`<text x="${m}" y="${m+f*1.2}" text-anchor="middle" font-size="${f*0.42}" class="t2">${small}</text>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">${out}</svg>`;
}

function home(){
  const segs=S.map(s=>{const[n,d]=cnt(s);return{n,d,c:COL[s.id][0],t:T(s.id)}});
  const N=segs.reduce((a,s)=>a+s.n,0),D=segs.reduce((a,s)=>a+s.d,0);
  let h=`<div class="hd"><h1>My Syllabus</h1><button class="back" data-a="theme" aria-label="Toggle dark mode">${isDark()?`<svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`:`<svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`}</button></div>${cdCard()}<div class="card" style="text-align:center">${donut(segs,230,28,pct(D,N)+'%','of syllabus read')}
  <div class="sub" style="margin-top:8px">${N?D+' of '+N+' topics read':'Open a subject and add your chapters to begin'}</div>
  <div class="leg">${S.map(s=>{const[n,d]=cnt(s);return `<span><b style="background:${COL[s.id][0]}"></b>${s.name} ${pct(d,n)}%</span>`}).join('')}</div></div>`;
  S.forEach(s=>{
    const[n,d]=cnt(s),c=COL[s.id][0],t=T(s.id);
    h+=`<div class="card sc" data-a="open" data-s="${s.id}" style="--c:${c}">${donut([{n,d,c,t}],58,9)}
    <div style="flex:1"><b>${s.name}</b><div class="sub">${d} / ${n} topics · ${s.p.reduce((a,P)=>a+P.ch.length,0)} chapters</div></div><span>${pct(d,n)}%</span></div>`;
  });
  const panel=bk==='show'?`<textarea id="bkt" readonly style="margin-top:10px">${esc(JSON.stringify(S))}</textarea><p class="hint">${bkMsg}</p>`
    :bk==='restore'?`<textarea id="bkt" placeholder="Paste your backup here" style="margin-top:10px"></textarea><button class="btn" data-a="bkgo">Restore</button><p class="hint" style="margin-top:8px">${bkMsg||'This replaces everything currently in the app.'}</p>`
    :bkMsg?`<p class="hint" style="margin-top:8px">${bkMsg}</p>`:'';
  h+=`<div class="card"><div class="cd-t">Backup</div><p class="hint" style="margin:6px 0 10px">Copy your chapters and progress to keep them safe or move them to another phone.</p><button class="btn g" data-a="bkc">Copy my data</button><button class="btn g" data-a="bkr">Restore from backup</button>${panel}</div>`;
  return h;
}

function subj(){
  const s=cur(),[n,d]=cnt(s),c=COL[s.id][0],t=T(s.id);
  let h=`<div class="top"><button class="back" data-a="back">‹</button><h1>${esc(s.name)}</h1></div>
  <div class="card" style="display:flex;align-items:center;gap:16px">${donut([{n,d,c,t}],96,13,pct(d,n)+'%')}
  <div class="sub">${d} of ${n} topics read<br>${s.p.reduce((a,P)=>a+P.ch.length,0)} chapters</div></div>`;
  s.p.forEach(P=>{
    const[pn,pd]=pcnt(P);
    h+=`<div class="card sc" data-a="openp" data-p="${P.id}" style="--c:${c}"><div style="flex:1"><b>${esc(P.name)}</b>
    <div class="bar"><i style="width:${pct(pd,pn)}%;background:${c}"></i></div><div class="sub">${pd} / ${pn} topics · ${P.ch.length} chapters</div></div><span>${pct(pd,pn)}%</span></div>`;
  });
  return h;
}

function pap(){
  const s=cur(),P=PP(),[n,d]=pcnt(P),c=COL[s.id][0],t=T(s.id);
  let h=`<div class="top"><button class="back" data-a="back">‹</button><h1>${esc(s.name)} · ${esc(P.name)}</h1></div>
  <div class="card" style="display:flex;align-items:center;gap:16px">${donut([{n,d,c,t}],96,13,pct(d,n)+'%')}
  <div class="sub">${d} of ${n} topics read<br>${P.ch.length} chapters</div></div>`;
  P.ch.forEach(ch=>{
    const cn=ch.t.length,cd=ch.t.filter(x=>x.d).length;
    h+=`<div class="card sc" data-a="openc" data-c="${ch.id}" style="--c:${c}"><div style="flex:1"><b>${esc(ch.name)}</b>
    <div class="bar"><i style="width:${pct(cd,cn)}%;background:${c}"></i></div><div class="sub">${cd} / ${cn} topics</div></div><span>${pct(cd,cn)}%</span></div>`;
  });
  if(sheet){
    h+=`<div class="card"><p class="hint">Type each chapter on its own line. Put “-” before each topic of that chapter.</p>
    <textarea id="bulk" placeholder="Upper Limb&#10;- Brachial plexus&#10;- Shoulder joint&#10;Lower Limb&#10;- Hip joint"></textarea>
    <button class="btn" data-a="addch">Add</button><button class="btn g" data-a="sheet">Cancel</button></div>`;
  }else h+=`<button class="btn" data-a="sheet">+ Add chapters &amp; topics</button>`;
  return h;
}

function chap(){
  const s=cur(),c=CH(),col=COL[s.id][0],n=c.t.length,d=c.t.filter(t=>t.d).length;
  return `<div style="--c:${col}"><div class="top"><button class="back" data-a="back">‹</button><h1>${esc(c.name)}</h1></div>
  <div class="card"><div class="bar"><i style="width:${pct(d,n)}%;background:${col}"></i></div><div class="sub">${d} of ${n} topics read · ${pct(d,n)}%</div></div>
  <div class="card" style="padding:4px 14px">${n?c.t.map(t=>`<div class="topic ${t.d?'on':''}" data-a="tog" data-t="${t.id}"><span class="chk">${t.d?'✓':''}</span><span class="nm">${esc(t.name)}</span><button class="x" data-a="delt" data-t="${t.id}">${pend==='t'+t.id?'<small style="color:#b0688a">Delete?</small>':'×'}</button></div>`).join(''):'<div class="sub" style="padding:12px 0">No topics yet</div>'}</div>
  <div class="card"><textarea id="nt" placeholder="Add topics, one per line"></textarea><button class="btn" data-a="addt">Add topics</button></div>
  <button class="btn g" data-a="delc">${pend==='c'+c.id?'Tap again to delete chapter':'Delete chapter'}</button></div>`;
}

function render(keep){
  const y=keep?scrollY:0;
  app.innerHTML=V.c?chap():V.p?pap():V.s?subj():home();
  scrollTo(0,y);
}

function parse(txt,s){
  let cur=null;
  txt.split('\n').forEach(l=>{
    l=l.trim();if(!l)return;
    const m=l.match(/^[-•*]\s*(.+)/);
    if(m){
      if(!cur){cur={id:uid(),name:'General',t:[]};s.ch.push(cur)}
      cur.t.push({id:uid(),name:m[1],d:0});
    }else{cur={id:uid(),name:l,t:[]};s.ch.push(cur)}
  });
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,D=el.dataset;
  const nav=['open','back','openp','openc'].includes(a);
  if(a==='open'){V.s=D.s;V.p=null;V.c=null;sheet=false}
  else if(a==='openp'){V.p=D.p;V.c=null;sheet=false}
  else if(a==='back'){if(V.c)V.c=null;else if(V.p)V.p=null;else V.s=null;sheet=false;pend=null}
  else if(a==='openc'){V.c=D.c}
  else if(a==='tog'){const t=CH().t.find(x=>x.id===D.t);t.d=t.d?0:1;save()}
  else if(a==='sheet'){sheet=!sheet}
  else if(a==='cd'){cdMode=(cdMode+1)%3;try{localStorage.setItem('syl-cd',cdMode)}catch(e){}updateCd();return}
  else if(a==='bkc'){
    const txt=JSON.stringify(S);bk='show';bkMsg='Select all the text above and copy it.';
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>{bkMsg='Copied. Paste it somewhere safe, like Notes.';render(true)},()=>render(true));}
  }
  else if(a==='bkr'){bk=bk==='restore'?null:'restore';bkMsg=''}
  else if(a==='bkgo'){
    try{
      const p=JSON.parse(document.getElementById('bkt').value.trim());
      if(!Array.isArray(p)||!p.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&(Array.isArray(s.p)||Array.isArray(s.ch))))throw 0;
      p.forEach(s=>{if(!s.p){s.p=[{id:s.id+'x',name:'Imported',ch:s.ch}];delete s.ch}});
      V={s:null,p:null,c:null};S=p;save();bk=null;bkMsg='Restored ✓';
    }catch(err){bkMsg='That doesn’t look like a valid backup.'}
  }
  else if(a==='theme'){setTheme(isDark()?'light':'dark');return}
  else if(a==='addch'){parse(document.getElementById('bulk').value,PP());sheet=false;save()}
  else if(a==='addt'){
    document.getElementById('nt').value.split('\n').forEach(l=>{l=l.trim().replace(/^[-•*]\s*/,'');if(l)CH().t.push({id:uid(),name:l,d:0})});
    save();
  }
  else if(a==='delt'||a==='delc'){
    e.stopPropagation();
    const k=a==='delt'?'t'+D.t:'c'+V.c;
    if(pend===k){
      pend=null;
      if(a==='delt')CH().t=CH().t.filter(x=>x.id!==D.t);
      else{PP().ch=PP().ch.filter(x=>x.id!==V.c);V.c=null}
      save();
    }else{pend=k;setTimeout(()=>{if(pend===k){pend=null;render(true)}},3000)}
  }
  render(!nav&&!(a==='delc'&&!V.c));
});
applyTheme();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
